<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Loading…</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:ital,wght@0,400;0,600;0,800;0,900;1,400&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body>

  <!-- SIDE NAV -->
  <nav class="side-nav" aria-label="Page sections" id="side-nav"></nav>

  <!-- NAV -->
  <nav>
    <div class="nav-in">
      <div class="nav-logo">ML</div>
      <ul class="nav-links" id="nav-links"></ul>
      <a id="nav-cta" href="#" class="nav-cta">Contact</a>
    </div>
  </nav>

  <!-- HERO -->
  <div id="about">
    <section id="hero">
      <img class="hero-bg-img" id="hero-bg" src="" alt="" />
      <div class="hero-noise"></div>
      <div class="hero-year" id="hero-year"></div>
      <div class="hero-tagline" id="hero-tagline"></div>
      <div class="hero-meta-float" id="hero-meta"></div>
      <div class="hero-name-block" id="hero-name"></div>
      <div class="hero-scroll">Scroll to explore</div>
    </section>
  </div>

  <!-- COMPETITIONS -->
  <div id="poster-competitions" class="poster d"></div>
  <section id="competitions">
    <div class="section-wrap" style="padding-top:40px;padding-bottom:100px">
      <div class="stair-container reveal" id="stair-container"></div>
    </div>
  </section>

  <!-- RESEARCH -->
  <div id="poster-research" class="poster g slant-l"></div>
  <section id="research">
    <div class="section-wrap reveal" id="research-heading"></div>
    <div class="section-wrap" id="research-items"></div>
  </section>

  <!-- ACTIVITIES -->
  <div id="poster-activities" class="poster d slant-r"></div>
  <section id="activities">
    <div class="act-banner-wrap" id="act-banner-wrap"></div>
    <div class="act-cols reveal" id="act-cols"></div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-in">
      <div id="footer-info"></div>
      <div class="f-links" id="footer-links"></div>
    </div>
  </footer>

  <script src="main.js" defer></script>
</body>

</html>
